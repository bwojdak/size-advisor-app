# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b474e5d098403c5b0b1525ba6de0fc12"
name = "hejunia"
application_url = "https://size-advisor-app-production-7e87.up.railway.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://size-advisor-app-production-7e87.up.railway.app/auth/callback",
  "https://size-advisor-app-production-7e87.up.railway.app/auth/shopify/callback",
  "https://size-advisor-app-production-7e87.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://size-advisor-app-production-7e87.up.railway.app/api"
subpath = "size-advisor"
prefix = "apps"
